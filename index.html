<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניתוח פגישות — קרן פילנתרופית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#f7f5f0;color:#1a1714;min-height:100vh;display:flex;flex-direction:column}
.hero{background:#1e3a5f;color:#fff;padding:3rem 2rem 2.5rem;text-align:center}
.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.6rem}
.hero h1{font-size:2rem;font-weight:300;margin-bottom:.4rem}
.hero h1 strong{font-weight:600}
.hero p{font-size:14px;color:rgba(255,255,255,.5)}
.main{max-width:600px;margin:3rem auto;padding:0 1.5rem;flex:1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:2rem}
.card{background:#fff;border:1px solid #e2ddd6;border-radius:16px;padding:2rem;text-align:center;text-decoration:none;color:#1a1714;transition:all .2s;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.card-ico{font-size:2.5rem;margin-bottom:1rem}
.card h2{font-size:18px;font-weight:500;margin-bottom:.4rem}
.card p{font-size:13px;color:#7a7369}
.card-adi{border-top:4px solid #1e3a5f}
.card-anbar{border-top:4px solid #2d5a3d}
.footer{text-align:center;padding:2rem;font-size:12px;color:#b0a89e}
</style>
</head>
<body>
<div class="hero">
  <div class="lbl">קרן פילנתרופית — ניהול זמן</div>
  <h1><strong>ניתוח פגישות</strong> חודשי</h1>
  <p>בחרי מנהלת לצפייה בניתוח הפגישות החודשי</p>
</div>
<div class="main">
  <div class="cards">
    <a href="adi.html" class="card card-adi">
      <div class="card-ico">👩‍💼</div>
      <h2>עדי</h2>
      <p>ניתוח פגישות חודשי, היסטוריה והשוואות</p>
    </a>
    <a href="inbar.html" class="card card-anbar">
      <div class="card-ico">👩‍💼</div>
      <h2>ענבר</h2>
      <p>ניתוח פגישות חודשי, היסטוריה והשוואות</p>
    </a>
  </div>
</div>
<div class="footer">קרן פילנתרופית · מערכת ניתוח פגישות</div>
</body>
</html>
